[project]
name = "stt"
version = "0.1"
description = "STT service - Speech recognition using Whisper"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "faster-whisper>=1.0.0",
    "pyyaml>=6.0.0",
    "python-multipart>=0.0.12",
    "numpy>=1.26.0",
    "webrtcvad>=2.0.10",
    "websockets>=12.0",
    "pydantic>=2.9.0",
    "echo-common",
]

[tool.uv]
package = false

[tool.uv.sources]
echo-common = { git = "https://github.com/ramonlabs/echo.git", subdirectory = "services/common" }

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "RUF", "PIE", "TRY", "PERF", "PLR2004"]
ignore = ["RUF001", "RUF010", "TRY003", "TRY300", "TRY301"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "RUF012", "PLR2004"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Query",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
files = ["."]
ignore_missing_imports = true
implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["stt-venv/"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
